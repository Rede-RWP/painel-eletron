name: Release Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Empacotar AppImage + pasta + .deb com helper
        run: |
          npx electron-builder --x64 --linux AppImage tar.gz dir
          python3 criar-deb.py

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ppf-painel-multitask_*_amd64.deb
            dist/*.AppImage
            dist/*.tar.gz
