<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA RWP - MULTITASK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dock-bg: #1c2430;
            --btn-inicio: #4a5568;
            --btn-cardapio: #9b2ef0;
            --btn-ifood: #e84a5f;
            --btn-gestao: #2eb8e6;
            --btn-rwp: #4f46c8;
            --dock-pad: 10px;
            --dock-h: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: #0b0f14;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .main-container {
            position: absolute;
            inset: 0;
            background: #f4f5f7;
        }

        .page-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            z-index: 1;
        }

        .page-frame.active {
            display: block;
            z-index: 10;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, #e8ecf4 0%, transparent 55%),
                linear-gradient(180deg, #f7f8fa 0%, #e9edf3 100%);
            color: #1a2332;
            padding-bottom: calc(var(--dock-h) + 48px);
        }

        #home-screen h1 {
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-align: center;
        }

        #home-screen p {
            font-size: 1rem;
            font-weight: 500;
            color: #5a6578;
        }

        /* Dock v2 — barra flutuante inferior */
        .dock {
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: var(--dock-pad);
            min-height: var(--dock-h);
            background: var(--dock-bg);
            border-radius: 999px;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.35),
                0 2px 8px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: dock-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes dock-in {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .nav-btn {
            appearance: none;
            border: 2px solid transparent;
            cursor: pointer;
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: clamp(0.7rem, 1.1vw, 0.85rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 14px 22px;
            min-width: 96px;
            border-radius: 999px;
            background: var(--btn-inicio);
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease,
                filter 0.18s ease;
            white-space: nowrap;
        }

        .btn-cardweb { background: var(--btn-cardapio); }
        .btn-ifood { background: var(--btn-ifood); }
        .btn-gestao { background: var(--btn-gestao); }
        .btn-rwp { background: var(--btn-rwp); }

        .nav-btn:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.08);
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        .nav-btn.active {
            border-color: #fff;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        @media (max-width: 720px) {
            .dock {
                left: 12px;
                right: 12px;
                width: auto;
                transform: none;
                justify-content: space-between;
                gap: 6px;
                padding: 8px;
                border-radius: 28px;
                animation: none;
            }

            .nav-btn {
                flex: 1;
                min-width: 0;
                padding: 12px 6px;
                font-size: 0.65rem;
                letter-spacing: 0.02em;
            }
        }

        .home-version {
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #8a93a3;
            letter-spacing: 0.04em;
        }

        #update-overlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 200;
            align-items: center;
            justify-content: center;
            background: rgba(11, 15, 20, 0.55);
            padding: 24px;
        }

        #update-overlay.visible {
            display: flex;
        }

        .update-card {
            width: min(440px, 100%);
            background: #1c2430;
            color: #fff;
            border-radius: 20px;
            padding: 28px 26px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .update-card h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .update-card p {
            font-size: 0.95rem;
            font-weight: 500;
            color: #c5ccd6;
            line-height: 1.45;
        }

        .update-notes {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #9aa3b0;
        }

        .update-bar {
            margin-top: 18px;
            height: 8px;
            border-radius: 999px;
            background: #2d3848;
            overflow: hidden;
        }

        .update-bar > span {
            display: block;
            height: 100%;
            width: 0%;
            background: #2eb8e6;
            transition: width 0.2s ease;
        }

        .update-card.success .update-bar > span { background: #22c55e; }
        .update-card.error .update-bar > span { background: #e84a5f; width: 100%; }
    </style>
</head>
<body>
    <div class="app">
        <main class="main-container">
            <div id="home" class="page-frame active">
                <div id="home-screen">
                    <h1>SISTEMA PIZZA PIZZA FRANQUIAS</h1>
                    <p>Selecione um sistema no menu</p>
                    <p class="home-version" id="app-version"></p>
                </div>
            </div>
            <!-- Sites externos rodam em BrowserView (main.js) — reCAPTCHA do CW precisa de top-level -->
        </main>

        <nav class="dock" aria-label="Navegação principal">
            <button type="button" onclick="showPage('home', this)" class="nav-btn active">Início</button>
            <button type="button" onclick="showPage('cardweb', this)" class="nav-btn btn-cardweb">Cardápio</button>
            <button type="button" onclick="showPage('ifood', this)" class="nav-btn btn-ifood">iFood</button>
            <button type="button" onclick="showPage('gestao', this)" class="nav-btn btn-gestao">Gestão</button>
            <button type="button" onclick="showPage('rwp', this)" class="nav-btn btn-rwp">RWP</button>
        </nav>

        <div id="update-overlay" aria-live="polite">
            <div class="update-card" id="update-card">
                <h2 id="update-title">Atualização</h2>
                <p id="update-message"></p>
                <p class="update-notes" id="update-notes"></p>
                <div class="update-bar"><span id="update-fill"></span></div>
            </div>
        </div>
    </div>

    <script>
        let activePageId = 'home';

        function showPage(id, btn) {
            if (id === activePageId) return;

            document.getElementById('home').classList.toggle('active', id === 'home');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activePageId = id;

            if (window.painelNav && window.painelNav.showPage) {
                window.painelNav.showPage(id).catch(() => {});
            }
        }

        (function setupUpdates() {
            const overlay = document.getElementById('update-overlay');
            const card = document.getElementById('update-card');
            const title = document.getElementById('update-title');
            const message = document.getElementById('update-message');
            const notes = document.getElementById('update-notes');
            const fill = document.getElementById('update-fill');
            const versionEl = document.getElementById('app-version');
            let hideTimer;

            function setOverlay(visible) {
                overlay.classList.toggle('visible', visible);
                if (window.painelNav && window.painelNav.setOverlay) {
                    window.painelNav.setOverlay(visible).catch(() => {});
                }
            }

            if (window.painelUpdates && window.painelUpdates.version) {
                window.painelUpdates.version().then((v) => {
                    if (v) versionEl.textContent = 'Versão ' + v;
                }).catch(() => {});
            }

            if (!window.painelUpdates || !window.painelUpdates.onStatus) return;

            window.painelUpdates.onStatus((payload) => {
                clearTimeout(hideTimer);
                const phase = payload.phase || '';
                card.classList.remove('success', 'error');
                setOverlay(true);
                notes.textContent = payload.notes || '';
                message.textContent = payload.message || '';
                fill.style.width = (payload.percent || 0) + '%';

                if (phase === 'success') {
                    title.textContent = 'Atualizado com sucesso';
                    card.classList.add('success');
                    fill.style.width = '100%';
                    return;
                }
                if (phase === 'error') {
                    title.textContent = 'Não foi possível atualizar';
                    card.classList.add('error');
                    hideTimer = setTimeout(() => setOverlay(false), 8000);
                    return;
                }
                if (phase === 'info') {
                    title.textContent = 'Nova versão';
                    hideTimer = setTimeout(() => setOverlay(false), 7000);
                    return;
                }
                title.textContent = 'Atualizando o sistema';
            });
        })();
    </script>
</body>
</html>
