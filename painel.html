<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA RWP - MULTITASK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: #0b0f14;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100%;
            background: #0b0f14;
        }

        .main-container {
            position: absolute;
            inset: 0;
            background: #0b0f14;
        }

        .page-frame {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 1;
        }

        .page-frame.active {
            display: block;
            z-index: 10;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, #e8ecf4 0%, transparent 55%),
                linear-gradient(180deg, #f7f8fa 0%, #e9edf3 100%);
            color: #1a2332;
            padding: 24px;
        }

        #home-screen h1 {
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-align: center;
        }

        #home-screen p {
            font-size: 1rem;
            font-weight: 500;
            color: #5a6578;
        }

        .home-version {
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #8a93a3;
            letter-spacing: 0.04em;
        }

        .home-hint {
            margin-top: 28px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #9aa3b0;
            letter-spacing: 0.02em;
        }

        #update-overlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 200;
            align-items: center;
            justify-content: center;
            background: rgba(11, 15, 20, 0.55);
            padding: 24px;
        }

        #update-overlay.visible {
            display: flex;
        }

        .update-card {
            width: min(440px, 100%);
            background: #1c2430;
            color: #fff;
            border-radius: 20px;
            padding: 28px 26px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .update-card h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .update-card p {
            font-size: 0.95rem;
            font-weight: 500;
            color: #c5ccd6;
            line-height: 1.45;
        }

        .update-notes {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #9aa3b0;
        }

        .update-bar {
            margin-top: 18px;
            height: 8px;
            border-radius: 999px;
            background: #2d3848;
            overflow: hidden;
        }

        .update-bar > span {
            display: block;
            height: 100%;
            width: 0%;
            background: #2eb8e6;
            transition: width 0.2s ease;
        }

        .update-card.success .update-bar > span { background: #22c55e; }
        .update-card.error .update-bar > span { background: #e84a5f; width: 100%; }
    </style>
</head>
<body>
    <div class="app">
        <main class="main-container">
            <div id="home" class="page-frame active">
                <div id="home-screen">
                    <h1>SISTEMA PIZZA PIZZA FRANQUIAS</h1>
                    <p>Selecione um sistema no menu</p>
                    <p class="home-version" id="app-version"></p>
                    <p class="home-hint">Passe o mouse na borda inferior para abrir o menu</p>
                </div>
            </div>
        </main>

        <div id="update-overlay" aria-live="polite">
            <div class="update-card" id="update-card">
                <h2 id="update-title">Atualização</h2>
                <p id="update-message"></p>
                <p class="update-notes" id="update-notes"></p>
                <div class="update-bar"><span id="update-fill"></span></div>
            </div>
        </div>
    </div>

    <script>
        (function setupHomeActive() {
            if (!window.painelNav || !window.painelNav.onActivePage) return;
            window.painelNav.onActivePage((payload) => {
                const home = document.getElementById('home');
                if (!home || !payload) return;
                home.classList.toggle('active', payload.id === 'home');
            });
        })();

        (function setupUpdates() {
            const overlay = document.getElementById('update-overlay');
            const card = document.getElementById('update-card');
            const title = document.getElementById('update-title');
            const message = document.getElementById('update-message');
            const notes = document.getElementById('update-notes');
            const fill = document.getElementById('update-fill');
            const versionEl = document.getElementById('app-version');
            let hideTimer;

            function setOverlay(visible) {
                overlay.classList.toggle('visible', visible);
                if (window.painelNav && window.painelNav.setOverlay) {
                    window.painelNav.setOverlay(visible).catch(() => {});
                }
            }

            if (window.painelUpdates && window.painelUpdates.version) {
                window.painelUpdates.version().then((v) => {
                    if (v) versionEl.textContent = 'Versão ' + v;
                }).catch(() => {});
            }

            if (!window.painelUpdates || !window.painelUpdates.onStatus) return;

            window.painelUpdates.onStatus((payload) => {
                clearTimeout(hideTimer);
                const phase = payload.phase || '';
                card.classList.remove('success', 'error');
                setOverlay(true);
                notes.textContent = payload.notes || '';
                message.textContent = payload.message || '';
                fill.style.width = (payload.percent || 0) + '%';

                if (phase === 'success') {
                    title.textContent = 'Atualizado com sucesso';
                    card.classList.add('success');
                    fill.style.width = '100%';
                    return;
                }
                if (phase === 'error') {
                    title.textContent = 'Não foi possível atualizar';
                    card.classList.add('error');
                    hideTimer = setTimeout(() => setOverlay(false), 8000);
                    return;
                }
                if (phase === 'info') {
                    title.textContent = 'Nova versão';
                    hideTimer = setTimeout(() => setOverlay(false), 7000);
                    return;
                }
                title.textContent = 'Atualizando o sistema';
            });
        })();
    </script>
</body>
</html>
