<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>PPF Dock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --btn-inicio: #5b6578;
      --btn-cardapio: #9b2ef0;
      --btn-ifood: #e84a5f;
      --btn-gestao: #2eb8e6;
      --btn-rwp: #4f46c8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Outfit', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 20px 18px;
      background: transparent;
      /* Vinheta suave só atrás do pill — conteúdo continua visível */
      background-image: linear-gradient(
        to top,
        rgba(8, 10, 14, 0.28) 0%,
        rgba(8, 10, 14, 0.08) 42%,
        rgba(8, 10, 14, 0) 100%
      );
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    body.dock-open .stage {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .dock {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      min-height: 64px;
      border-radius: 999px;
      background: rgba(22, 28, 38, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.28),
        0 2px 10px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
      backdrop-filter: blur(22px) saturate(1.35);
    }

    .nav-btn {
      appearance: none;
      border: 2px solid transparent;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: clamp(0.68rem, 1vw, 0.82rem);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 13px 20px;
      min-width: 92px;
      border-radius: 999px;
      background: var(--btn-inicio);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        filter 0.18s ease;
      white-space: nowrap;
    }

    .btn-cardweb { background: var(--btn-cardapio); }
    .btn-ifood { background: var(--btn-ifood); }
    .btn-gestao { background: var(--btn-gestao); }
    .btn-rwp { background: var(--btn-rwp); }

    .nav-btn:hover {
      transform: translateY(-2px) scale(1.04);
      filter: brightness(1.1);
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn.active {
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.28),
        0 8px 22px rgba(0, 0, 0, 0.28);
    }

    @media (max-width: 720px) {
      .stage { padding: 0 10px 12px; }
      .dock {
        width: 100%;
        justify-content: space-between;
        gap: 4px;
        padding: 8px;
        border-radius: 28px;
      }
      .nav-btn {
        flex: 1;
        min-width: 0;
        padding: 12px 4px;
        font-size: 0.62rem;
        letter-spacing: 0.02em;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <nav class="dock" aria-label="Navegação principal">
      <button type="button" data-page="home" class="nav-btn active">Início</button>
      <button type="button" data-page="cardweb" class="nav-btn btn-cardweb">Cardápio</button>
      <button type="button" data-page="ifood" class="nav-btn btn-ifood">iFood</button>
      <button type="button" data-page="gestao" class="nav-btn btn-gestao">Gestão</button>
      <button type="button" data-page="rwp" class="nav-btn btn-rwp">RWP</button>
    </nav>
  </div>

  <script>
    function setActive(id) {
      document.querySelectorAll('.nav-btn').forEach((b) => {
        b.classList.toggle('active', b.getAttribute('data-page') === id);
      });
    }

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-page');
        setActive(id);
        if (window.painelNav && window.painelNav.showPage) {
          window.painelNav.showPage(id).catch(() => {});
        }
      });
    });

    if (window.painelNav && window.painelNav.onDockVisibility) {
      window.painelNav.onDockVisibility((payload) => {
        document.body.classList.toggle('dock-open', !!(payload && payload.open));
        if (payload && payload.activePage) setActive(payload.activePage);
      });
    }

    if (window.painelNav && window.painelNav.onActivePage) {
      window.painelNav.onActivePage((payload) => {
        if (payload && payload.id) setActive(payload.id);
      });
    }
  </script>
</body>
</html>
